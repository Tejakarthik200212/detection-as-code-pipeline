title: SSH Brute Force Attempt
id: 6f8a1c22-1b3d-4e9a-9f0a-1a2b3c4d5e6f
status: experimental
description: >
  Detects repeated failed SSH authentication attempts from the same source IP
  within a short window, indicating a possible brute-force attack.
author: Tejakarthik Reddy Banka
date: 2026/07/26
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains:
      - 'Failed password'
      - 'authentication failure'
  timeframe: 2m
  condition: selection | count() by src_ip >= 6
fields:
  - src_ip
  - user
falsepositives:
  - A legitimate user repeatedly mistyping their password
  - Misconfigured automation retrying an expired credential
tags:
  - attack.credential_access
  - attack.t1110
