title: Possible SQL Injection Attempt
id: d4e1f2a3-4b5c-6d7e-8f9a-0b1c2d3e4f5a
status: experimental
description: >
  Detects web requests containing common SQL injection patterns,
  indicating an attempt to manipulate a database through user input.
author: Tejakarthik Reddy Banka
date: 2026/07/26
references:
  - https://attack.mitre.org/techniques/T1190/
logsource:
  product: webserver
  service: access
detection:
  selection:
    request|contains:
      - "' OR 1=1"
      - "UNION SELECT"
      - "'--"
  condition: selection
fields:
  - request
  - src_ip
falsepositives:
  - Legitimate application code or comments containing similar text patterns
  - Security testing or penetration testing activity
level: high
tags:
  - attack.initial_access
  - attack.t1190